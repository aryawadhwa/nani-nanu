<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,400;1,600&family=Montserrat:wght@400;500;600;700&family=Rozha+One&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  
  html, body {
    width: 1200px;
    height: 630px;
    overflow: hidden;
    background: #09040e;
    color: #f7f4ec;
    font-family: 'Cormorant Garamond', Georgia, serif;
    -webkit-font-smoothing: antialiased;
  }

  .banner-container {
    width: 1200px;
    height: 630px;
    position: relative;
    background: radial-gradient(ellipse at 50% 40%, #2e1442 0%, #160a22 55%, #08030d 95%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    padding: 34px 50px 30px;
    text-align: center;
  }

  .border-outer {
    position: absolute;
    top: 24px; left: 24px; right: 24px; bottom: 24px;
    border: 1.5px solid rgba(212, 175, 55, 0.45);
    border-radius: 18px;
    pointer-events: none;
    box-shadow: inset 0 0 40px rgba(0, 0, 0, 0.8), 0 0 20px rgba(212, 175, 55, 0.1);
  }

  .border-inner {
    position: absolute;
    top: 32px; left: 32px; right: 32px; bottom: 32px;
    border: 0.75px solid rgba(212, 175, 55, 0.22);
    border-radius: 12px;
    pointer-events: none;
  }

  .sanskrit-header {
    font-family: 'Rozha One', 'Devanagari Sangam MN', serif;
    font-size: 23px;
    color: #dfbe76;
    letter-spacing: 0.05em;
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .dot-sep { color: #c49942; opacity: 0.7; }

  .badge-row {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 4px 18px;
    border: 1px solid rgba(212, 175, 55, 0.32);
    border-radius: 9999px;
    font-family: 'Montserrat', sans-serif;
    font-size: 12px;
    letter-spacing: 0.22em;
    color: #faedd0;
    background: rgba(20, 10, 30, 0.55);
    margin-top: 4px;
  }

  .couple-names {
    font-family: 'Cinzel Decorative', 'Cormorant Garamond', serif;
    font-size: 64px;
    font-weight: 900;
    letter-spacing: 0.05em;
    line-height: 1.1;
    margin-top: 4px;
    background: linear-gradient(135deg, #fff7de 0%, #e8ca84 42%, #c2953c 80%, #fcedc0 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 3px 12px rgba(0,0,0,0.85));
  }
  .couple-names .amp {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-weight: 400;
    font-size: 58px;
    margin: 0 10px;
    -webkit-text-fill-color: #e2c27c;
  }

  .invite-line {
    font-family: 'Montserrat', sans-serif;
    font-size: 13.5px;
    font-weight: 400;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: #c4b096;
    margin-top: 2px;
  }

  .anniversary-title {
    font-family: 'Cinzel Decorative', 'Cormorant Garamond', serif;
    font-size: 32px;
    font-weight: 700;
    color: #e8ca84;
    letter-spacing: 0.08em;
    margin-top: 2px;
  }

  .dates-venue-bar {
    display: flex;
    align-items: center;
    gap: 16px;
    font-family: 'Montserrat', sans-serif;
    font-size: 13.5px;
    letter-spacing: 0.16em;
    color: #faedd0;
    text-transform: uppercase;
    font-weight: 500;
    margin-top: 6px;
  }
  .dates-venue-bar .sep { color: #c49942; }

  .rsvp-row {
    font-family: 'Montserrat', sans-serif;
    font-size: 13px;
    letter-spacing: 0.08em;
    color: #cfa959;
    font-weight: 500;
  }
</style>
</head>
<body>

<div class="banner-container">
  <div class="border-outer"></div>
  <div class="border-inner"></div>

  <div class="sanskrit-header">
    <span>॥ श्री गणेशाय नमः ॥</span>
    <span class="dot-sep">•</span>
    <span>॥ श्री जानकीवल्लभो विजयते ॥</span>
  </div>

  <div class="badge-row">
    <span>1976 — 2026 • 50TH GOLDEN ANNIVERSARY</span>
  </div>

  <h1 class="couple-names">ANITA <span class="amp">&</span> VIMAL</h1>

  <p class="invite-line">Cordially invite you to celebrate their</p>
  <h2 class="anniversary-title">Golden Jubilee Celebration</h2>

  <div class="dates-venue-bar">
    <span>December 26 – 28, 2026</span>
    <span class="sep">•</span>
    <span>Sawarthia Sewa Sadan, Ayodhya Dham</span>
  </div>

  <p class="rsvp-row">RSVP: Kunal (+91 98390 19029) &nbsp;•&nbsp; Trisha (+91 99841 34800)</p>
</div>

</body>
</html>
